<h2>
    Produto selecionado:
    @if(produtoSelecionado()){
        <strong style="color: plum"> {{produtoSelecionado() | uppercase}}</strong>
    }@else{
        <span style="color: pink">Nenhum Produto Selecionado</span>
    }
</h2>
@for(item of produtos(); track item){
    <app-produto
    [nome]='item.nome'
    [preco]='item.preco'
    (produtoSelecionado) ="exibirProduto($event)"
    ></app-produto>
}
<p><button (click)="adicionarProduto()">adicionar produto</button></p>
<p><button (click)="substituirProdutos()">Substituir Produto</button></p>
<h2>total de Produtos: {{totalProdutos()}}</h2>
<h3>Valor Total: {{valorTotal() | precoFormatado}}</h3>
