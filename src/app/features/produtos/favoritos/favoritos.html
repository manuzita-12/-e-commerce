<section class="pagina-produtos">
    <header class="cabeçalho-produtos">
        <div>
            <h2>Meus favoritos</h2>
            <p>Gerencie sua lista de produtos favoritos</p>
        </div>
        <button mat-raised-button color="primary" type="button" routerLink="/produtos">Ver Produtos</button>
    </header>

    <hr>

    @if (favorito().length === 0){
        <section class="mensagem-erro">
        <p><strong> Nenhum produto favorito adicionado</strong></p>
        </section>
    }@else{
    <section class="grid-produtos">
        @for (item of favorito(); track $index) {
            <mat-card class="produto-card">
                <mat-card-header>
                    <mat-card-title>{{ item }}</mat-card-title>
                </mat-card-header>

                <mat-card-actions>
                    <button mat-stroked-button color="accent" (click)="removerFavorito(item)">Remover</button>
                </mat-card-actions>
            </mat-card>
        }

    </section>
    }
</section>
